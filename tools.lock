# Hadolint lints Dockerfiles, with ShellCheck built in for RUN instructions.
# Its releases publish bare binaries and a checksums file, but no signature
# or provenance attestation, so these pins rest on SHA-256 alone; each was
# checked against checksums.sha256 of the v2.15.1 release. The download is
# the binary itself, so `binary_sha256` equals `sha256`.
[hadolint]
version = "2.15.1"
source = "https://github.com/hadolint/hadolint/releases/tag/v2.15.1"
license = "GPL-3.0"
verification = "sha256 (the project publishes no signature)"

