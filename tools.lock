# The opengrep-rules repository is archived. This is its final commit.
[rules]
name = "opengrep-rules"
repository = "https://github.com/opengrep/opengrep-rules"
commit = "f1d2b562b414783763fd02a6ed2736eaed622efa"
url = "https://codeload.github.com/opengrep/opengrep-rules/tar.gz/f1d2b562b414783763fd02a6ed2736eaed622efa"
sha256 = "9a5f1cd5c625418cc1c776120123e2d4371df9bb66e099426b17c3488e13619d"
license = "LGPL-2.1 with the Commons Clause"
# Only these top-level directories are extracted. yaml/ includes
# yaml/github-actions.
languages = ["python", "javascript", "typescript", "rust", "bash", "dockerfile", "yaml", "generic"]
# SHA-256 of the sorted list of "<path>\t<sha256>\n" lines for every file
# that install extracts (the rule files for the languages above and LICENSE).
# Installed rules are checked against this value, never against a file in
# the tools directory.
files_sha256 = "a68b561be77859f3987e0beb4b8f579083824a04eaf5bcc755c0e19a33bcf5e9"

# Gitleaks finds secrets. Its releases publish a checksums file but no
# signature or provenance attestation, so these pins rest on SHA-256 alone:
# each archive's hash below was checked against gitleaks_8.30.1_checksums.txt,
# and `binary_sha256` is the hash of the `gitleaks` binary extracted from it,
# which `scan` checks before every run.
[gitleaks]
version = "8.30.1"
source = "https://github.com/gitleaks/gitleaks/releases/tag/v8.30.1"
license = "MIT"
verification = "sha256 (the project publishes no signature)"
member = "gitleaks"

# The default rules, from the commit the v8.30.1 tag points to. `scan` always
# passes this file, so a repository's own .gitleaks.toml cannot change them.
[gitleaks.config]
url = "https://raw.githubusercontent.com/gitleaks/gitleaks/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml"
sha256 = "e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf"

