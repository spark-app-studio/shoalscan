# Shoalscan tools lock.
#
# Every file that `shoalscan install` downloads is pinned here by version and
# SHA-256. A download whose SHA-256 differs is refused. Opengrep binaries are
# also checked with `cosign verify-blob` against the certificate identity of
# the Opengrep release workflow below.
#
# To update a pin, download the new asset, compute its SHA-256 yourself, check
# it against the project's published checksums or signature, and change the
# version, URLs and hashes together in one reviewed commit.

lock_version = 1

[opengrep]
version = "1.30.2"
source = "https://github.com/opengrep/opengrep/releases/tag/v1.30.2"
license = "LGPL-2.1"

# The release binaries are signed keylessly by the release workflow. The
# certificate names the workflow on the release branch, and the workflow commit
# is the commit that the v1.30.2 tag points to.
[opengrep.signature]
certificate_identity = "https://github.com/opengrep/opengrep/.github/workflows/rolling-release.yml@refs/heads/release-v1.30.2"
certificate_oidc_issuer = "https://token.actions.githubusercontent.com"
github_workflow_repository = "opengrep/opengrep"
github_workflow_sha = "062fc871dbe9951887d0b985ea30977d3c36d315"

