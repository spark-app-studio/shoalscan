[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shoalscan"
version = "0.4.0"
description = "Run pinned, verified security scanners over a repository and check findings against a baseline."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]

[project.scripts]
shoalscan = "shoalscan.cli:main"

# The lock file, Shoalscan's own rules, its test-scope rules and the icon live at the repository root and are
# shipped inside the package as `shoalscan/_data/`.
[tool.setuptools]
package-dir = { "" = "src", "shoalscan._data" = "." }
packages = ["shoalscan", "shoalscan.dashboard", "shoalscan._data"]
include-package-data = false

[tool.setuptools.package-data]
"shoalscan._data" = ["tools.lock", "rules/*.yaml", "scope/*.yaml", "assets/shoalscan-icon.svg"]
"shoalscan.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

# Style: PEP 8, with 120-character lines. Ruff is a development tool only;
# Shoalscan itself depends on nothing outside the standard library.
[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# B: likely bugs (flake8-bugbear), such as zip() without strict= or an unused loop variable.
select = ["E", "W", "F", "N", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# The schema migrations are SQL text that has shipped; they are never edited, not even to wrap lines.
"src/shoalscan/history.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["shoalscan"]
# The tests' own modules come before shoalscan: importing `helpers` puts src/
# on the import path, so a source checkout runs the tests without installing.
known-local-folder = ["fake_idp", "helpers", "history_fixtures", "test_end_to_end", "test_lock_and_install"]
section-order = ["future", "standard-library", "third-party", "local-folder", "first-party"]
