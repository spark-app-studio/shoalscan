rules:
  - id: rust-secret-in-log
    message: >-
      A value named like a secret (password, token, API key, private key,
      credential) is passed to a log macro. Logs are copied, shipped and kept
      for a long time, so the secret leaks. Log a fixed placeholder, or an
      identifier that is not secret, instead.
    severity: ERROR
    languages: [rust]
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: MEDIUM
      category: security
      fix: Do not log the secret; log a redacted marker or wrap it in a type whose Debug and Display print "***".
    # Opengrep cannot bind a macro name to a metavariable, so the log and
    # tracing macros are listed one by one. Macro arguments are token trees, so
    # only these argument shapes are matched; coverage is partial by design.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: trace!(..., $SECRET, ...)
                  - pattern: trace!(..., $OBJ.$SECRET, ...)
                  - pattern: trace!($KEY = %$SECRET, ...)
                  - pattern: trace!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: trace!($KEY = ?$SECRET, ...)
                  - pattern: trace!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: trace!($KEY = $SECRET, ...)
                  - pattern: trace!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: debug!(..., $SECRET, ...)
                  - pattern: debug!(..., $OBJ.$SECRET, ...)
                  - pattern: debug!($KEY = %$SECRET, ...)
                  - pattern: debug!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: debug!($KEY = ?$SECRET, ...)
                  - pattern: debug!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: debug!($KEY = $SECRET, ...)
                  - pattern: debug!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: info!(..., $SECRET, ...)
                  - pattern: info!(..., $OBJ.$SECRET, ...)
                  - pattern: info!($KEY = %$SECRET, ...)
                  - pattern: info!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: info!($KEY = ?$SECRET, ...)
                  - pattern: info!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: info!($KEY = $SECRET, ...)
                  - pattern: info!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: warn!(..., $SECRET, ...)
                  - pattern: warn!(..., $OBJ.$SECRET, ...)
                  - pattern: warn!($KEY = %$SECRET, ...)
                  - pattern: warn!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: warn!($KEY = ?$SECRET, ...)
                  - pattern: warn!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: warn!($KEY = $SECRET, ...)
                  - pattern: warn!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: error!(..., $SECRET, ...)
                  - pattern: error!(..., $OBJ.$SECRET, ...)
                  - pattern: error!($KEY = %$SECRET, ...)
                  - pattern: error!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: error!($KEY = ?$SECRET, ...)
                  - pattern: error!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: error!($KEY = $SECRET, ...)
                  - pattern: error!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: tracing::trace!(..., $SECRET, ...)
                  - pattern: tracing::trace!(..., $OBJ.$SECRET, ...)
                  - pattern: tracing::trace!($KEY = %$SECRET, ...)
                  - pattern: tracing::trace!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: tracing::trace!($KEY = ?$SECRET, ...)
                  - pattern: tracing::trace!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: tracing::trace!($KEY = $SECRET, ...)
                  - pattern: tracing::trace!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: tracing::debug!(..., $SECRET, ...)
                  - pattern: tracing::debug!(..., $OBJ.$SECRET, ...)
                  - pattern: tracing::debug!($KEY = %$SECRET, ...)
                  - pattern: tracing::debug!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: tracing::debug!($KEY = ?$SECRET, ...)
                  - pattern: tracing::debug!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: tracing::debug!($KEY = $SECRET, ...)
                  - pattern: tracing::debug!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: tracing::info!(..., $SECRET, ...)
                  - pattern: tracing::info!(..., $OBJ.$SECRET, ...)
                  - pattern: tracing::info!($KEY = %$SECRET, ...)
                  - pattern: tracing::info!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: tracing::info!($KEY = ?$SECRET, ...)
                  - pattern: tracing::info!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: tracing::info!($KEY = $SECRET, ...)
                  - pattern: tracing::info!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: tracing::warn!(..., $SECRET, ...)
                  - pattern: tracing::warn!(..., $OBJ.$SECRET, ...)
                  - pattern: tracing::warn!($KEY = %$SECRET, ...)
                  - pattern: tracing::warn!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: tracing::warn!($KEY = ?$SECRET, ...)
                  - pattern: tracing::warn!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: tracing::warn!($KEY = $SECRET, ...)
                  - pattern: tracing::warn!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: tracing::error!(..., $SECRET, ...)
                  - pattern: tracing::error!(..., $OBJ.$SECRET, ...)
                  - pattern: tracing::error!($KEY = %$SECRET, ...)
                  - pattern: tracing::error!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: tracing::error!($KEY = ?$SECRET, ...)
                  - pattern: tracing::error!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: tracing::error!($KEY = $SECRET, ...)
                  - pattern: tracing::error!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: log::trace!(..., $SECRET, ...)
                  - pattern: log::trace!(..., $OBJ.$SECRET, ...)
                  - pattern: log::trace!($KEY = %$SECRET, ...)
                  - pattern: log::trace!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: log::trace!($KEY = ?$SECRET, ...)
                  - pattern: log::trace!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: log::trace!($KEY = $SECRET, ...)
                  - pattern: log::trace!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: log::debug!(..., $SECRET, ...)
                  - pattern: log::debug!(..., $OBJ.$SECRET, ...)
                  - pattern: log::debug!($KEY = %$SECRET, ...)
                  - pattern: log::debug!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: log::debug!($KEY = ?$SECRET, ...)
                  - pattern: log::debug!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: log::debug!($KEY = $SECRET, ...)
                  - pattern: log::debug!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: log::info!(..., $SECRET, ...)
                  - pattern: log::info!(..., $OBJ.$SECRET, ...)
                  - pattern: log::info!($KEY = %$SECRET, ...)
                  - pattern: log::info!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: log::info!($KEY = ?$SECRET, ...)
                  - pattern: log::info!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: log::info!($KEY = $SECRET, ...)
                  - pattern: log::info!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: log::warn!(..., $SECRET, ...)
                  - pattern: log::warn!(..., $OBJ.$SECRET, ...)
                  - pattern: log::warn!($KEY = %$SECRET, ...)
                  - pattern: log::warn!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: log::warn!($KEY = ?$SECRET, ...)
                  - pattern: log::warn!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: log::warn!($KEY = $SECRET, ...)
                  - pattern: log::warn!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: log::error!(..., $SECRET, ...)
                  - pattern: log::error!(..., $OBJ.$SECRET, ...)
                  - pattern: log::error!($KEY = %$SECRET, ...)
                  - pattern: log::error!($FIELD, $KEY = %$SECRET, ...)
                  - pattern: log::error!($KEY = ?$SECRET, ...)
                  - pattern: log::error!($FIELD, $KEY = ?$SECRET, ...)
                  - pattern: log::error!($KEY = $SECRET, ...)
                  - pattern: log::error!($KEY = %$OBJ.$SECRET, ...)
                  - pattern: trace!(?$SECRET, ...)
                  - pattern: trace!(%$SECRET, ...)
                  - pattern: trace!($FIELD, ?$SECRET, ...)
                  - pattern: trace!($FIELD, %$SECRET, ...)
                  - pattern: debug!(?$SECRET, ...)
                  - pattern: debug!(%$SECRET, ...)
                  - pattern: debug!($FIELD, ?$SECRET, ...)
                  - pattern: debug!($FIELD, %$SECRET, ...)
                  - pattern: info!(?$SECRET, ...)
                  - pattern: info!(%$SECRET, ...)
                  - pattern: info!($FIELD, ?$SECRET, ...)
                  - pattern: info!($FIELD, %$SECRET, ...)
                  - pattern: warn!(?$SECRET, ...)
                  - pattern: warn!(%$SECRET, ...)
                  - pattern: warn!($FIELD, ?$SECRET, ...)
                  - pattern: warn!($FIELD, %$SECRET, ...)
                  - pattern: error!(?$SECRET, ...)
                  - pattern: error!(%$SECRET, ...)
                  - pattern: error!($FIELD, ?$SECRET, ...)
                  - pattern: error!($FIELD, %$SECRET, ...)
                  - pattern: tracing::trace!(?$SECRET, ...)
                  - pattern: tracing::trace!(%$SECRET, ...)
                  - pattern: tracing::trace!($FIELD, ?$SECRET, ...)
                  - pattern: tracing::trace!($FIELD, %$SECRET, ...)
                  - pattern: tracing::debug!(?$SECRET, ...)
                  - pattern: tracing::debug!(%$SECRET, ...)
                  - pattern: tracing::debug!($FIELD, ?$SECRET, ...)
                  - pattern: tracing::debug!($FIELD, %$SECRET, ...)
                  - pattern: tracing::info!(?$SECRET, ...)
                  - pattern: tracing::info!(%$SECRET, ...)
                  - pattern: tracing::info!($FIELD, ?$SECRET, ...)
                  - pattern: tracing::info!($FIELD, %$SECRET, ...)
                  - pattern: tracing::warn!(?$SECRET, ...)
                  - pattern: tracing::warn!(%$SECRET, ...)
                  - pattern: tracing::warn!($FIELD, ?$SECRET, ...)
                  - pattern: tracing::warn!($FIELD, %$SECRET, ...)
                  - pattern: tracing::error!(?$SECRET, ...)
                  - pattern: tracing::error!(%$SECRET, ...)
                  - pattern: tracing::error!($FIELD, ?$SECRET, ...)
                  - pattern: tracing::error!($FIELD, %$SECRET, ...)
                  - pattern: log::trace!(?$SECRET, ...)
                  - pattern: log::trace!(%$SECRET, ...)
                  - pattern: log::trace!($FIELD, ?$SECRET, ...)
                  - pattern: log::trace!($FIELD, %$SECRET, ...)
                  - pattern: log::debug!(?$SECRET, ...)
                  - pattern: log::debug!(%$SECRET, ...)
                  - pattern: log::debug!($FIELD, ?$SECRET, ...)
