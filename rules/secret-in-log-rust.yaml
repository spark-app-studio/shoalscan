                  - pattern: tracing::trace!(%$SECRET)
                  - pattern: tracing::trace!(?$SECRET)
                  - pattern: tracing::debug!(%$SECRET)
                  - pattern: tracing::debug!(?$SECRET)
                  - pattern: tracing::info!(%$SECRET)
                  - pattern: tracing::info!(?$SECRET)
                  - pattern: tracing::warn!(%$SECRET)
                  - pattern: tracing::warn!(?$SECRET)
                  - pattern: tracing::error!(%$SECRET)
                  - pattern: tracing::error!(?$SECRET)
                  - pattern: log::trace!(%$SECRET)
                  - pattern: log::trace!(?$SECRET)
                  - pattern: log::debug!(%$SECRET)
                  - pattern: log::debug!(?$SECRET)
                  - pattern: log::info!(%$SECRET)
                  - pattern: log::info!(?$SECRET)
                  - pattern: log::warn!(%$SECRET)
                  - pattern: log::warn!(?$SECRET)
                  - pattern: log::error!(%$SECRET)
                  - pattern: log::error!(?$SECRET)
                  - pattern: println!(..., $SECRET, ...)
                  - pattern: println!(..., $OBJ.$SECRET, ...)
                  - pattern: eprintln!(..., $SECRET, ...)
                  - pattern: eprintln!(..., $OBJ.$SECRET, ...)
                  - pattern: print!(..., $SECRET, ...)
                  - pattern: print!(..., $OBJ.$SECRET, ...)
                  - pattern: eprint!(..., $SECRET, ...)
                  - pattern: eprint!(..., $OBJ.$SECRET, ...)
              - metavariable-regex:
                  metavariable: $SECRET
                  regex: (?i)^[a-z0-9_]*(password|passwd|secret|secret_?key|token|api_?key|private_?key|credentials?|creds?)$
          - patterns:
              - pattern-either:
                  - pattern: trace!("$FMT", ...)
                  - pattern: debug!("$FMT", ...)
                  - pattern: info!("$FMT", ...)
                  - pattern: warn!("$FMT", ...)
                  - pattern: error!("$FMT", ...)
                  - pattern: tracing::trace!("$FMT", ...)
                  - pattern: tracing::debug!("$FMT", ...)
                  - pattern: tracing::info!("$FMT", ...)
                  - pattern: tracing::warn!("$FMT", ...)
                  - pattern: tracing::error!("$FMT", ...)
                  - pattern: log::trace!("$FMT", ...)
                  - pattern: log::debug!("$FMT", ...)
                  - pattern: log::info!("$FMT", ...)
