rules:
  - id: node-tls-verification-disabled
    message: >-
      TLS certificate verification is turned off, so any server can impersonate
      the remote host. Keep `rejectUnauthorized` at its default (true); to trust
      a private CA, pass it with the `ca` option.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: HIGH
      category: security
      fix: Remove rejectUnauthorized false and NODE_TLS_REJECT_UNAUTHORIZED=0; pass the CA with the `ca` option.
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: $OBJ.rejectUnauthorized = false
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
