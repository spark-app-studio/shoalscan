rules:
  - id: rust-plain-http-url
    message: >-
      This URL uses plain http://, so traffic to it can be read and changed on
      the network. Use https://. Loopback addresses, the cloud metadata
      address, reserved example and test domains (RFC 2606 and RFC 6761) and
      well-known XML namespace identifiers are not reported. Test modules (`mod tests`) and async tests are skipped.
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      confidence: MEDIUM
      category: security
      fix: Change the URL to https:// and make sure the server offers TLS.
    paths:
      exclude:
        - "tests/"
        - "benches/"
        - "*_test.rs"
        - "*_tests.rs"
    # Report the literal only, not every place a constant holding it is used.
    options:
      constant_propagation: false
    patterns:
      - pattern: '"$URL"'
      - pattern-not-inside: |
          mod tests { ... }
      - pattern-not-inside: |
          mod test { ... }
      - pattern-not-inside: |
          #[tokio::test]
          async fn $F(...) { ... }
      - metavariable-regex:
          metavariable: $URL
          regex: >-
            (?i)^http://(?!(localhost|127(\.\d{1,3}){3}|0\.0\.0\.0|\[::1\]|169\.254\.169\.254|([a-z0-9-]+\.)*(localhost|test|invalid|example)|([a-z0-9-]+\.)*example\.(com|org|net))(:(\d+|\{[^}]*\}|\$\{[^}]*\}))?(?=[/?#]|$))(?!(www\.w3\.org|schemas\.xmlsoap\.org|schemas\.microsoft\.com|json-schema\.org|purl\.org|ns\.adobe\.com|xmlns\.com)/)[^\s"'/]+
