rules:
  - id: node-secret-in-log
    message: >-
      A value named like a secret (password, token, API key, private key,
      credential) is passed to a log call. Logs are copied, shipped and kept
      for a long time, so the secret leaks. Log a fixed placeholder, or an
      identifier that is not secret, instead.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: MEDIUM
      category: security
      fix: Do not log the secret; log a redacted marker such as "***" or a non-secret id.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $LOG.$METHOD(..., $SECRET, ...)
                  - pattern: $LOG.$METHOD(..., `...${$SECRET}...`, ...)
                  - pattern: $LOG.$METHOD(..., $STR + $SECRET, ...)
                  - pattern: $LOG.$METHOD(..., JSON.stringify($SECRET, ...), ...)
                  - pattern: '$LOG.$METHOD(..., {..., $SECRET, ...}, ...)'
                  - pattern: '$LOG.$METHOD(..., {..., $KEY: $SECRET, ...}, ...)'
              - metavariable-regex:
                  metavariable: $SECRET
                  regex: (?i)^([a-z0-9_$]*\.)*[a-z0-9_$]*(password|passwd|secret|secret_?key|token|api_?key|private_?key|credentials?|creds?)$
          # Any value under a key named like a secret.
          - patterns:
              - pattern: '$LOG.$METHOD(..., {..., $KEY: $VAL, ...}, ...)'
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^[\"']?[a-z0-9_$-]*(password|passwd|secret|secret_?key|token|api_?key|private_?key|credentials?|creds?)[\"']?$
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(log|debug|info|warn|warning|error|trace|fatal)$
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(this\.)?_?(console|logger|log)$
