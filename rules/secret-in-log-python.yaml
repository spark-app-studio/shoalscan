rules:
  - id: python-secret-in-log
    message: >-
      A value named like a secret (password, token, API key, private key,
      credential) is passed to a log call. Logs are copied, shipped and kept
      for a long time, so the secret leaks. Log a fixed placeholder, or an
      identifier that is not secret, instead.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: MEDIUM
      category: security
      fix: Do not log the secret; log a redacted marker such as "***" or a non-secret id.
    pattern-either:
      # A value named like a secret, passed to a logger.
      - patterns:
          - pattern-either:
              - pattern: $LOG.$METHOD(..., $SECRET, ...)
              - pattern: $LOG.$METHOD(..., f"...{$SECRET}...", ...)
              - pattern: $LOG.$METHOD(..., $FMT % $SECRET, ...)
              - pattern: $LOG.$METHOD(..., $FMT.format(..., $SECRET, ...), ...)
              - pattern: '$LOG.$METHOD(..., extra={..., $KEY: $SECRET, ...}, ...)'
              - pattern: $LOG.$METHOD(..., $KW=$SECRET, ...)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^(self\.|cls\.)?_{0,2}(logging|logger|log|audit_log)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^([a-z0-9_]*\.)*[a-z0-9_]*(password|passwd|secret|secret_?key|token|api_?key|private_?key|credentials?|creds?)$
      # The same through logging.getLogger(...).<method>(...).
      - patterns:
          - pattern-either:
              - pattern: logging.getLogger(...).$METHOD(..., $SECRET, ...)
              - pattern: logging.getLogger(...).$METHOD(..., f"...{$SECRET}...", ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^([a-z0-9_]*\.)*[a-z0-9_]*(password|passwd|secret|secret_?key|token|api_?key|private_?key|credentials?|creds?)$
      # print() of a value named like a secret.
      - patterns:
          - pattern-either:
              - pattern: print(..., $SECRET, ...)
              - pattern: print(..., f"...{$SECRET}...", ...)
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^([a-z0-9_]*\.)*[a-z0-9_]*(password|passwd|secret|secret_?key|token|api_?key|private_?key|credentials?|creds?)$
      # Any value under a key named like a secret in `extra`.
      - patterns:
          - pattern-either:
              - pattern: '$LOG.$METHOD(..., extra={..., "$KEY": $VAL, ...}, ...)'
              - pattern: '$LOG.$METHOD(..., extra=dict(..., $KEY=$VAL, ...), ...)'
              - pattern: $LOG.$METHOD(..., $KEY=$VAL, ...)
          - metavariable-regex:
              metavariable: $LOG
              regex: (?i)^(self\.|cls\.)?_{0,2}(logging|logger|log|audit_log)$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
          - metavariable-regex:
              metavariable: $KEY
              regex: (?i)^[\"']?[a-z0-9_-]*(password|passwd|secret|secret_?key|token|api_?key|private_?key|credentials?|creds?)[\"']?$
