<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">Shoalscan</title>
  <desc id="d">A cheerful cartoon steamship sails straight toward a shoal where a little bug hides just under the waves, while a lighthouse beam lights up the danger.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1B3A"/>
      <stop offset="1" stop-color="#22487F"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E7FA3"/>
      <stop offset="1" stop-color="#0B3E5E"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFE38A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity="0.2"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
    <clipPath id="hull"><path d="M26 138 H 160 L 146 172 Q 94 184 42 172 Z"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- night sky, stars and moon -->
    <rect x="8" y="8" width="240" height="240" fill="url(#sky)"/>
    <g fill="#FFFFFF">
      <circle cx="40" cy="40" r="2.4"/>
      <circle cx="70" cy="62" r="1.8"/>
      <circle cx="150" cy="34" r="2.2"/>
      <circle cx="176" cy="70" r="1.6"/>
      <circle cx="28" cy="94" r="1.6"/>
    </g>
    <path d="M118 46 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#FFE38A"/>
    <circle cx="44" cy="70" r="11" fill="#FFF1C1"/>
    <circle cx="50" cy="66" r="10" fill="#14305C"/>

    <!-- back sea -->
    <path d="M8 152 Q 34 142 60 152 T 112 152 T 164 152 T 216 152 T 268 152 V 248 H 8 Z" fill="url(#sea)"/>
    <path d="M8 152 Q 34 142 60 152 T 112 152 T 164 152 T 216 152 T 268 152" fill="none" stroke="#8EE3F5" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- the shoal: a rock just under the surface, with a sneaky bug on it -->
    <path d="M168 214 Q 176 186 204 184 Q 234 184 244 214 Z" fill="#123A52" stroke="#0A1630" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#0A1630" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M196 182 l-8 -12"/>
      <path d="M214 182 l8 -12"/>
      <path d="M190 198 l-12 4"/>
      <path d="M220 198 l12 4"/>
    </g>
    <circle cx="187" cy="169" r="3.5" fill="#0A1630"/>
    <circle cx="223" cy="169" r="3.5" fill="#0A1630"/>
    <ellipse cx="205" cy="196" rx="19" ry="14" fill="#FF5E62" stroke="#0A1630" stroke-width="5"/>
    <path d="M205 182 V 210" stroke="#0A1630" stroke-width="3.5"/>
    <circle cx="196" cy="200" r="3.2" fill="#0A1630"/>
    <circle cx="214" cy="202" r="3.2" fill="#0A1630"/>
    <circle cx="198" cy="184" r="5.5" fill="#FFFFFF" stroke="#0A1630" stroke-width="3"/>
    <circle cx="212" cy="184" r="5.5" fill="#FFFFFF" stroke="#0A1630" stroke-width="3"/>
    <circle cx="196.6" cy="183.6" r="2.4" fill="#0A1630"/>
    <circle cx="210.6" cy="183.6" r="2.4" fill="#0A1630"/>

    <!-- water over the shoal: hidden just under the surface -->
    <path d="M-4 194 Q 18 186 40 194 T 84 194 T 128 194 T 172 194 T 216 194 T 260 194 V 250 H -4 Z" fill="#0E5577" opacity="0.72"/>
    <path d="M-4 194 Q 18 186 40 194 T 84 194 T 128 194 T 172 194 T 216 194 T 260 194" fill="none" stroke="#8EE3F5" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

    <!-- smoke puffs drifting back -->
    <g fill="#E3EAF3" stroke="#0A1630" stroke-width="3">
      <circle cx="76" cy="66" r="9"/>
      <circle cx="60" cy="54" r="7"/>
      <circle cx="47" cy="44" r="5"/>
    </g>

    <!-- the ship, sailing right toward the shoal -->
    <!-- mast and pennant -->
    <path d="M122 110 V 82" stroke="#0A1630" stroke-width="4" stroke-linecap="round"/>
    <path d="M122 82 L 142 88 L 122 94 Z" fill="#FFD166" stroke="#0A1630" stroke-width="3" stroke-linejoin="round"/>
    <!-- funnel -->
    <path d="M78 116 L 82 78 H 100 L 102 116 Z" fill="#FFD166" stroke="#0A1630" stroke-width="5" stroke-linejoin="round"/>
    <path d="M81 88 H 101" stroke="#0A1630" stroke-width="6"/>
    <!-- cabin -->
    <rect x="54" y="106" width="78" height="34" rx="7" fill="#FBF6EA" stroke="#0A1630" stroke-width="5"/>
    <!-- porthole eyes, happily looking ahead (and not down) -->
    <circle cx="80" cy="122" r="8" fill="#FFFFFF" stroke="#0A1630" stroke-width="4"/>
    <circle cx="104" cy="122" r="8" fill="#FFFFFF" stroke="#0A1630" stroke-width="4"/>
    <circle cx="83" cy="120" r="3.6" fill="#0A1630"/>
    <circle cx="107" cy="120" r="3.6" fill="#0A1630"/>
    <circle cx="84.4" cy="118.6" r="1.3" fill="#FFFFFF"/>
    <circle cx="108.4" cy="118.6" r="1.3" fill="#FFFFFF"/>
    <!-- hull -->
    <path d="M26 138 H 160 L 146 172 Q 94 184 42 172 Z" fill="#E63946"/>
    <g clip-path="url(#hull)">
      <rect x="20" y="146" width="150" height="7" fill="#FBF6EA"/>
      <rect x="20" y="166" width="150" height="20" fill="#9E1F2B"/>
    </g>
    <path d="M26 138 H 160 L 146 172 Q 94 184 42 172 Z" fill="none" stroke="#0A1630" stroke-width="6" stroke-linejoin="round"/>
    <!-- cheerful grin on the bow -->
    <path d="M128 156 Q 138 164 148 154" fill="none" stroke="#0A1630" stroke-width="3.5" stroke-linecap="round"/>
    <!-- bow wave -->
    <g fill="#FFFFFF" stroke="#0A1630" stroke-width="2.5">
      <circle cx="158" cy="166" r="5"/>
      <circle cx="166" cy="160" r="3.5"/>
      <circle cx="170" cy="168" r="3"/>
    </g>
    <!-- the ship's own waterline -->
    <path d="M8 176 Q 36 168 58 176 T 102 176 T 146 176 Q 162 182 172 196 H 8 Z" fill="#0E5577"/>
    <path d="M14 176 Q 36 168 58 176 T 102 176 T 146 176" fill="none" stroke="#8EE3F5" stroke-width="4" stroke-linecap="round"/>

    <!-- a lighthouse beam from off to the right lights up the danger -->
    <path d="M266 6 L 266 30 L 262 262 L 160 262 Z" fill="url(#beam)" opacity="0.42"/>
    <path d="M232 160 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#FFFFFF"/>
    <path d="M176 172 l2 4.5 4.5 2 -4.5 2 -2 4.5 -2 -4.5 -4.5 -2 4.5 -2 z" fill="#FFFFFF"/>
    <!-- warning sign above the hidden shoal -->
    <path d="M205 112 L 226 148 H 184 Z" fill="#FFD166" stroke="#0A1630" stroke-width="5" stroke-linejoin="round"/>
    <path d="M205 124 V 137" stroke="#0A1630" stroke-width="5" stroke-linecap="round"/>
    <circle cx="205" cy="143" r="2.6" fill="#0A1630"/>
  </g>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#0A1630" stroke-width="6"/>
</svg>
