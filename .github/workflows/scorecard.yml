name: scorecard

on:
  push:
    # Scorecard supports the default branch only.
    branches: [main]
  schedule:
    # Weekly, on Saturday at 01:30 UTC.
    - cron: "30 1 * * 6"
  # Re-run when branch protection changes, which Scorecard checks.
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code scanning.
      security-events: write
      # Needed to publish the results to the OpenSSF Scorecard API.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
