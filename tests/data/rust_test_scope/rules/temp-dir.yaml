rules:
  - id: temp-dir
    message: A file in the shared temporary directory can be read or replaced by other users.
    severity: WARNING
    languages: [rust]
    pattern: std::env::temp_dir()
  - id: other
    message: Not listed in test_scope, so it always blocks.
    severity: ERROR
    languages: [rust]
    pattern: std::process::exit(1)
